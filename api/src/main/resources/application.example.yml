# ================================================
# Resonance · 后端配置模板（请复制一份改名为 application.yml 后填入你自己的值）
# 注意：application.yml（真实配置）已被 .gitignore 忽略，不会被提交到 GitHub
# ================================================

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: resonance-api
  profiles:
    active: dev          # 本地开发=dev；生产部署=prod
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB        # 单个上传文件上限
      max-request-size: 50MB     # 单次请求总大小上限

---
# ================== 开发环境 profile ==================
spring:
  config:
    activate:
      on-profile: dev

  # ---------- 数据源：方式 A：H2 嵌入式数据库（零配置，开箱即用）----------
  datasource:
    url: jdbc:h2:file:./data/resonance-dev;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update           # 开发：自动建表/加字段
    show-sql: false
    open-in-view: false

  # ---------- 数据源：方式 B：MySQL（推荐长期使用）----------
  # 如切换到 MySQL，请注释上面 H2 块，取消注释下面的块并填写你的 MySQL 账号密码
  # datasource:
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://localhost:3306/resonance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  #   username: root
  #   password: YOUR_MYSQL_PASSWORD_HERE
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: false
  #   open-in-view: false

---
# ================== 生产环境 profile ==================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境强烈建议通过环境变量注入（不要把真实密码写进 YAML）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:resonance}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:resonance}
    password: ${MYSQL_PWD:CHANGE_ME_IN_PRODUCTION}
  jpa:
    hibernate:
      ddl-auto: validate         # 生产：只校验表结构，不自动修改（防止误删数据）
    show-sql: false
    open-in-view: false

---
# ================== 业务自定义配置 ==================
resonance:
  bootstrap:
    sample-data:
      # 是否在启动时自动灌入示例管理员 + 样例数据
      # 首次新库临时开一次；确认灌入后改回 false 再重启
      enabled: false

  security:
    # ⚠️  生产环境必须更换！！用环境变量注入最佳
    # 至少 32 字节随机字符串（推荐用 openssl rand -base64 64 生成）
    jwt-secret: "REPLACE_WITH_YOUR_OWN_LONG_RANDOM_SECRET_KEY_MIN_32_BYTES"
    jwt-expire-seconds: 604800   # JWT 有效期：7 天 = 604800 秒

  storage:
    # 上传文件在本机的存放目录（绝对/相对路径均可；生产建议挂独立数据盘）
    local-dir: ./uploads/
    # 文件对外访问 URL 前缀：
    #   - 开发阶段：后端直接映射 /files/** → http://localhost:8080/files
    #   - 生产阶段：Nginx 反代后改成你的域名，如 https://your-domain.com/files
    public-url-prefix: "http://localhost:8080/files"
